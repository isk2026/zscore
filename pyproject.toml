[project]
name = "zscore"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.0",
    "finance-datareader>=0.9.202",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
